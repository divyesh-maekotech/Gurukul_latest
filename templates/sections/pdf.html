<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF डाउनलोड</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="p-5">

<div class="container text-center">
  <h2>PDF डाउनलोड के लिए सबमिट करें</h2>

  <div id="content" class="border p-3 d-inline-block mt-4">
    <img id="posterImage" src="{{ url_for('static', filename='968acfa1-5ad1-4eb4-869f-7b4cf8bb7469.jpeg') }}" class="img-fluid" alt="Poster">
  </div>

  <br>
  <button id="downloadBtn" class="btn btn-primary mt-3">सबमिट और PDF डाउनलोड करें</button>
</div>

<script>
  const { jsPDF } = window.jspdf;

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const content = document.getElementById('content');

    html2canvas(content, { scale: 2 }).then(canvas => {
      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'px',
        format: [canvas.width, canvas.height]
      });

      pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
      pdf.save('poster.pdf');
    });
  });
</script>

</body>
</html>
