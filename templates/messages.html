<div class="card mt-4 shadow">
  <div class="card-header" style="background: var(--gradient-primary); color:white;">
    Contact Messages
  </div>
  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        {% for msg in messages %}
        <tr>
          <td>{{ msg.name }}</td>
          <td>{{ msg.email }}</td>
          <td>{{ msg.message|truncatechars:50 }}</td>
          <td>{{ msg.created_at }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No messages</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
