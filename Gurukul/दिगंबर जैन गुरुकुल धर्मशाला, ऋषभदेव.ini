भट्टारक परम्परा का इतिहास (संक्षिप्त विवरण):

जैन परंपरा में भट्टारकों का प्रारंभिक प्रादुर्भाव 11वीं सदी के प्रारंभ में माना जाता है। उस समय प्रतिकूल परिस्थितियों के कारण दिगंबर साधुओं के प्रवास में अनेक बाधाएँ उत्पन्न हुईं, जिससे धर्म-प्रचार में कठिनाई आने लगी। ऐसी स्थिति में धर्म की निरंतरता बनाए रखने हेतु  भट्टारक नियुक्त किए गए।

ये भट्टारक साधुओं के समान ही आचरण करते थे, किन्तु उन्हें वस्त्र धारण करने की छूट थी। उनके प्रमुख कार्य थे—मंदिर निर्माण, मूर्ति-प्रतिष्ठा, शास्त्र लेखन, जातिगत संगठनों की एकता एवं मजबूती, धार्मिक उत्सवों की व्यवस्था तथा जैन संस्कृति की रक्षा।

ऋषभदेव में विराजमान भट्टारक श्रीमद् यशकीर्तिजी महाराज, दिगंबर जैन नरसिंहपुरा लघु शाखा के 108वें प्रमुख थे। आपके गुरुदेव, भट्टारक श्रीमद क्षेमकीर्तिजी महाराज ने सन् 1900 ई. में केसरिया जी गाँव में चातुर्मास किया था। इसके लिए होली चौक क्षेत्र में एक कच्चा मकान क्रय किया गया, जहाँ चातुर्मास के दौरान धार्मिक क्रियाएँ सम्पन्न हुईं।

भट्टारकगण स्वयं विद्वान, कुशल प्रवक्ता एवं लेखक होते थे। वे अनेक दुर्लभ ग्रंथों का संग्रह रखते थे, जो उस समय इसी मकान में सुरक्षित रखे गए थे। शास्त्रों की सुरक्षा और भंडारण हेतु एक पक्के भवन की योजना बनाई गई, जिसे पंडित श्री रामचंद्रजी द्वारा सन् 1926 में प्रारंभ किया गया और सन् 1927 में यह भवन पूर्ण रूप से निर्मित हो गया।

होली चौक में स्थित वर्तमान भट्टारक भवन (मंदिर) उसी योजना का साकार रूप है। भवन निर्माण के उपलक्ष्य में सन् 1928 में एक भव्य इंद्रध्वज विधान का आयोजन किया गया, जिसमें पूज्य आचार्य श्री शांतिसागरजी महाराज की विशेष उपस्थिति रही। यह आयोजन एक विशाल क्षेत्रीय महोत्सव में परिवर्तित हो गया, जिसमें एक विराट ग्राम-यात्रा एवं ग्रामभोज भी आयोजित  किया गया।

इस भवन में स्थित सरस्वती भवन में आज भी अनेक दुर्लभ पांडुलिपियाँ सुरक्षित हैं। इसी परंपरा में वर्तमान में श्री महाराज यशकीर्ति दिगंबर जैन धर्माचार्य ट्रस्ट गुरुकुल की स्थापना हुई है। यह गुरुकुल भवन अब धार्मिक शिक्षा और सांस्कृतिक गतिविधियों का प्रमुख केंद्र बन चुका है।