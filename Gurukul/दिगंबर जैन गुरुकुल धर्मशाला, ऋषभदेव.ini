श्री भट्टारक  दिगंबर जैन धर्मार्थ ट्रस्ट एवं धर्मशाला
(उदयपुर–अहमदाबाद मार्ग, राष्ट्रीय राजमार्ग-8 पर, उदयपुर से लगभग 65 किमी दूरी पर स्थित)
ऋषभदेव मंदिर अपनी अद्भुत शिल्पकला अतिशय प्रभाव एवं प्राचीनता के कारण सम्पूर्ण भारत में विख्यात है। देशभर से श्रद्धालु यहाँ दर्शनार्थ आते हैं। यह मंदिर अत्यंत प्राचीन है, जहाँ आदिकाल से ही केसर -++ पूजा, अर्चना और अभिषेक की परंपरा रही है।
जनश्रुति है कि देवगण स्वयं इस पावन स्थल पर केसर-वर्षा करने आते हैं। केसर की पावनता, इसकी सुगंध एवं मूर्ति को दृढ़ता प्रदान करने का विलक्षण गुण इस परंपरा को विशेष बनाता है। शताब्दियों से केसर-पूजन के कारण इस मंदिर को केशरिया जी मंदिर" के नाम से भी जाना जाता है। चूंकि यह मूलनायक प्रतिमा काले पाषाण से उत्कीर्ण है, अतः इसे कालिया बाबा के नाम से भी प्रसिद्धि प्राप्त है।
ऐतिहासिक विवरणों के अनुसार यह मंदिर प्रारंभ में दूसरी शताब्दी में कच्ची ईंटों से निर्मित था। आठवीं शताब्दी में इसे परेवा पत्थर से पुनर्निर्मित किया गया। खेला मंडप में स्थित एक प्राचीन शिलालेख से ज्ञात होता है कि संवत् 1431 में इस मंदिर का जीर्णोद्धार हुआ और वर्तमान स्वरूप प्राप्त हुआ।
प्रसिद्ध इतिहासकारों के अनुसार, यह प्रतिमा डूंगरपुर जिले के वाट्पद्रुक (बड़ीदा) से लाई गई थी। कुछ पुरातत्वविदों का मानना है कि इस मूर्ति का संबंध जवास व ख़ुनादरी के जैन मंदिरों से है। सारतः यह कहा जा सकता है कि सुरक्षा की दृष्टि से इस दिव्य प्रतिमा को यहाँ प्रतिष्ठित किया गया था।
भगवान ऋषभदेव के नाम पर बसे इस नगर को "ऋषभदेव" कहा जाता है, जबकि प्राचीन अभिलेखों के अनुसार इसका प्राचीन नाम धुलेवा भी प्रमाणित होता है। इस नगर के तीन ओर से कोयल नदी प्रवाहित होती है, जो मंदिर की परिक्रमा का प्रतीक मानी जाती है।
भगवान ऋषभदेव के दर्शन मात्र से श्रद्धालुओं की मनोकामनाएँ पूर्ण होती हैं। यही कारण है कि यह तीर्थ सम्पूर्ण भारत में आस्था, श्रद्धा और विश्वास का प्रमुख केंद्र बना हुआ है। प्रतिवर्ष लाखों श्रद्धालु यहाँ दर्शनार्थ एवं तीर्थयात्रा हेतु पधारते हैं।
गुरुकुल: एक नवपरंपरा का शुभारंभ
पूज्य भट्टारक श्रीमद् यशकीर्तिजी ने जब शिक्षा की ज्योति प्रज्वलित करने का संकल्प लिया, तब स्थानीय स्थल पर एक भवन का निर्माण कराया गया। इसका उद्देश्य धार्मिक, शैक्षणिक एवं सामाजिक गतिविधियों हेतु उपयोग करना था। वर्ष 1944 में इस गुरुकुल का शुभारंभ हुआ।
इस परिसर में एक वाचनालय, शास्त्र भंडार, स्वर्ण व रजत उपकरण, बर्तन आदि की व्यवस्था थी। प्रारंभ में यह एक ख्यातिप्राप्त छात्रावास था, जहाँ अनेक जिलों से विद्यार्थी आकर निवास करते एवं अध्ययन करते थे। यहाँ से शिक्षा प्राप्त कर कई छात्र उच्च पदों पर आसीन हुए तथा विद्वान के रूप में प्रतिष्ठित हुए।
कालांतर में, स्थानीय स्तर पर उच्च शिक्षण संस्थानों की कमी तथा आसपास के गांवों में विद्यालय खुलने के कारण छात्र संख्या में कमी आई। इसके पश्चात इस भवन को धर्मशाला का रूप दिया गया और एक भव्य शिखरबद्ध जिनालय का निर्माण कराया गया। इस मंदिर में भगवान ऋषभदेव की पद्मासन मुद्रा में विराजित भव्य प्रतिमा प्रतिष्ठित की गई है।
समय और आवश्यकताओं के अनुसार इस धर्मशाला एवं गुरुकुल परिसर का विस्तार आवश्यक हो गया है, जिसकी योजना वर्तमान में प्रस्तावित है।
विशेष: होली चौक स्थित ऐतिहासिक भवन
इस भवन में एक चैत्यालय स्थित है, जिसमें प्राचीन शास्त्र भंडार संरक्षित है। यहाँ पर लगभग 3000 हस्तलिखित ग्रंथ (पांडुलिपियाँ) उपलब्ध हैं, जो इस स्थान की ऐतिहासिक, धार्मिक और सांस्कृतिक गरिमा को सहेजते हैं।

